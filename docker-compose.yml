services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: hrms, POSTGRES_PASSWORD: hrms, POSTGRES_DB: hrms }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hrms:hrms@db:5432/hrms
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]
    ports: ["4000:4000"]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hrms:hrms@db:5432/hrms
      REDIS_URL: redis://redis:6379
    command: ["npx", "tsx", "src/modules/sources/worker.ts"]
    depends_on: [db, redis, api]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
